<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESS | Set Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <div class="logo-mark">ESS</div>
                <h1>Set Your Password</h1>
                <p>Create a new password for your account</p>
            </div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            autocomplete="new-password"
                            placeholder="Enter new password"
                        >
                        <button
                            type="button"
                            id="toggleNewPassword"
                            class="password-toggle"
                        >
                            Show
                        </button>
                    </div>
                    <span class="field-error" id="newPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            autocomplete="new-password"
                            placeholder="Confirm new password"
                        >
                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle"
                        >
                            Show
                        </button>
                    </div>
                    <span class="field-error" id="confirmPasswordError"></span>
                </div>

                <div class="password-requirements">
                    <p>Password must contain:</p>
                    <ul>
                        <li>At least 8 characters</li>
                        <li>One uppercase letter</li>
                        <li>One lowercase letter</li>
                        <li>One number</li>
                        <li>One special character</li>
                    </ul>
                </div>

                <div class="login-message" id="resetMessage"></div>

                <button
                    type="submit"
                    class="primary-button"
                    id="resetButton"
                >
                    Set Password
                </button>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/reset-password.js') }}"></script>
</body>
</html>
