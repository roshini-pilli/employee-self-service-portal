<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESS | Verify OTP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <div class="logo-mark">ESS</div>
                <h1>Verify OTP</h1>
                <p>Enter the 6-digit OTP sent to your registered email</p>
            </div>

            <form id="verifyOtpForm">
                <div class="form-group">
                    <label for="otp">OTP</label>
                    <input
                        type="text"
                        id="otp"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        placeholder="Enter 6-digit OTP"
                    >
                    <span class="field-error" id="otpError"></span>
                </div>

                <div class="login-message" id="otpMessage"></div>

                <button
                    type="submit"
                    class="primary-button"
                    id="verifyOtpButton"
                >
                    Verify OTP
                </button>
            </form>

            <div class="login-links">
                <a href="/forgot-password">Back</a>
                <span></span>
                <a href="/login">Login</a>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/verify-otp.js') }}"></script>
</body>
</html>
