<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESS | Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <div class="logo-mark">ESS</div>
                <h1>Forgot Password</h1>
                <p>Reset your ESS account password</p>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="userType">Account Type</label>
                    <div class="select-wrapper">
                        <select id="userType">
                            <option value="EMPLOYEE">Employee</option>
                            <option value="HR">HR</option>
                        </select>
                    </div>
                    <span class="field-error" id="userTypeError"></span>
                </div>

                <div class="form-group">
                    <label for="userId">ID</label>
                    <input
                        type="text"
                        id="userId"
                        autocomplete="username"
                        placeholder="Enter your ID"
                    >
                    <span class="field-error" id="userIdError"></span>
                </div>

                <div class="login-message" id="forgotMessage"></div>

                <button
                    type="submit"
                    class="primary-button"
                    id="sendOtpButton"
                >
                    Send OTP
                </button>
            </form>

            <div class="login-links">
                <a href="/login">Employee Login</a>
                <span></span>
                <a href="/hr-login">HR Login</a>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/forgot-password.js') }}"></script>
</body>
</html>
