<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESS | HR Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <div class="logo-mark">ESS</div>
                <h1>HR Login</h1>
                <p>Sign in to access the HR portal</p>
            </div>

            <form id="hrLoginForm">
                <div class="form-group">
                    <label for="hrId">HR ID</label>
                    <input
                        type="text"
                        id="hrId"
                        name="hr_id"
                        autocomplete="username"
                        placeholder="Enter your HR ID"
                    >
                    <span class="field-error" id="hrIdError"></span>
                </div>

                <div class="form-group">
                    <label for="hrPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="hrPassword"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                        >
                        <button
                            type="button"
                            id="toggleHrPassword"
                            class="password-toggle"
                        >
                            Show
                        </button>
                    </div>

                    <span class="field-error" id="hrPasswordError"></span>
                </div>

                <div class="login-message" id="hrLoginMessage"></div>

                <button
                    type="submit"
                    class="primary-button"
                    id="hrLoginButton"
                >
                    Login
                </button>
            </form>

            <div class="login-links">
                <a href="/login">Employee Login Here</a>
                <span></span>
                <a href="/forgot-password">Forgot Password?</a>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/hr-login.js') }}"></script>
</body>
</html>
