<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESS | Employee Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <div class="logo-mark">ESS</div>
                <h1>Employee Self Service</h1>
                <p>Sign in to access your employee portal</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="employeeId">Employee ID</label>
                    <input
                        type="text"
                        id="employeeId"
                        name="employee_id"
                        autocomplete="username"
                        placeholder="Enter your employee ID"
                    >
                    <span class="field-error" id="employeeIdError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                        >
                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Show
                        </button>
                    </div>
                    <span class="field-error" id="passwordError"></span>
                </div>

                <div class="login-message" id="loginMessage"></div>

                <button type="submit" class="primary-button" id="loginButton">
                    Login
                </button>
            </form>

            <div class="login-links">
                <a href="/forgot-password" id="forgotPassword">Forgot Password?</a>
                <span></span>
                <a href="/hr-login" id="hrLogin">HR Login Here</a>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
